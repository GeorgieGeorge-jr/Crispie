<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crispie - Healthy Snacks &amp; Drinks</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animations.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  const savedTheme = localStorage.getItem('crispie-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
</script>
</head>
<body>
  <div class="container" id="form-box">
    <!-- Sign In -->
    <div class="form-container signin-container">
      <h2>Sign In</h2>
      <form id="signin-form">
        <input type="email" id="signin-email" placeholder="Email" required />
        <input type="password" id="signin-password" placeholder="Password" required />
        <button type="submit">Sign In</button>
        <p id="signin-message" class="message"></p>
      </form>
    </div>

    <!-- Sign Up -->
    <div class="form-container signup-container">
      <h2>Sign Up</h2>
      <form id="signup-form">
        <input type="text" id="signup-username" placeholder="Username" required />
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <p id="signup-message" class="message"></p>
      </form>
    </div>

    <!-- Overlay -->
    <div class="overlay">
      <div class="overlay-content fade-in">
        <h2>Welcome to <strong>Crispie</strong></h2>
        <p>Healthy snacks &amp; drinks that energize your day</p>
        <button type="button" onclick="toggleForm()">Sign Up or Sign In</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
